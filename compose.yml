# podman-compose up -d --build（或 docker compose up -d --build）
#
# 拓扑：coo-web（anubis + caddy，internal 无出网）/ coo-api（pgsql + router，
# internal，pgsql 不发布端口）/ coo-egress（仅 router 出网到 S3/FTP）。
# 浏览器走 8082 anubis 进 WebUI；游戏客户端与管理接口直连 8081 的 API（绕过 anubis）。
#
# 部署环境变量在 compose.override.yml 实例化（敏感值经宿主 .env 注入，模板见 .env.example）。

services:
  coo-pgsql:
    container_name: coo-pgsql
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: cooservice
      POSTGRES_DB: cooservice
    networks:
      - coo-api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooservice -d cooservice"]
      interval: 5s
      timeout: 3s
      retries: 10

  coo-router:
    container_name: coo-router
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      coo-pgsql:
        condition: service_healthy
    environment:
      RUST_LOG: info
      BIND_ADDR: 0.0.0.0:8081
      MIGRATIONS_DIR: /migrations
      LOCAL_RESOURCE_DIR: /data/resource
    networks:
      - coo-api
      - coo-egress
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      # 本地完整副本：入池与同步推池的唯一推送源。
      # :U 改宿主目录属主为容器用户；:z 打共享 SELinux 标签（重建后可写）
      - ./data/resource:/data/resource:U,z
    restart: unless-stopped

  anubis:
    container_name: coo-anubis
    image: ghcr.io/techarohq/anubis:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      BIND: ":8082"
      TARGET: "http://caddy:80"
      # 本地直连取源 IP 作客户端地址；挂 cloudflared 反代后删此项，由反代注入 X-Real-Ip
      USE_REMOTE_ADDRESS: "true"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - coo-web

  caddy:
    container_name: coo-caddy
    build:
      context: .
      dockerfile: Containerfile.web
    restart: unless-stopped
    # 无对外端口：只被 coo-web 内网的 anubis 转发访问
    networks:
      - coo-web

networks:
  coo-web:
    name: coo-web
    internal: true
  coo-api:
    name: coo-api
    internal: true
  # 仅 router 加入：出网访问外部存储池终结点
  coo-egress:
    name: coo-egress

volumes:
  pgdata: